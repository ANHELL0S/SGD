services:

  # ── Base de datos PostgreSQL ──────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: oficios_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data_SGD:/var/lib/postgresql/data
    networks:
      - oficios_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Aplicación Laravel (PHP-FPM) ──────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_APP_NAME: ${APP_NAME}
        VITE_REVERB_APP_KEY: ${REVERB_APP_KEY}
        VITE_REVERB_HOST: ${VITE_REVERB_HOST}
        VITE_REVERB_PORT: ${REVERB_PORT}
        VITE_REVERB_SCHEME: ${REVERB_SCHEME}
        VITE_PUSHER_APP_KEY: ${PUSHER_APP_KEY}
        VITE_PUSHER_APP_CLUSTER: ${PUSHER_APP_CLUSTER}
    container_name: oficios_app
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - public_asset_SGD:/var/www/html/public
      - app_storage_SGD:/var/www/html/storage/app/public
      - app_logs_SGD:/var/www/html/storage/logs
    networks:
      - oficios_net
    depends_on:
      postgres:
        condition: service_healthy

  # ── Servidor web Nginx ────────────────────────────────────────
  nginx:
    build:
      context: ./docker/nginx
      dockerfile: Dockerfile
    container_name: oficios_nginx
    restart: unless-stopped
    ports:
      - "3005:80"
    volumes:
      - public_asset_SGD:/var/www/html/public:ro
      - app_storage_SGD:/var/www/storage:ro
    networks:
      - oficios_net
    depends_on:
      - app

  # ── Laravel Reverb (WebSockets) ───────────────────────────────
  reverb:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_APP_NAME: ${APP_NAME}
        VITE_REVERB_APP_KEY: ${REVERB_APP_KEY}
        VITE_REVERB_HOST: ${VITE_REVERB_HOST}
        VITE_REVERB_PORT: ${REVERB_PORT}
        VITE_REVERB_SCHEME: ${REVERB_SCHEME}
        VITE_PUSHER_APP_KEY: ${PUSHER_APP_KEY}
        VITE_PUSHER_APP_CLUSTER: ${PUSHER_APP_CLUSTER}
    container_name: oficios_reverb
    restart: unless-stopped
    command: ["php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=8080"]
    env_file:
      - .env
    ports:
      - "8080:8080"
    networks:
      - oficios_net
    depends_on:
      postgres:
        condition: service_healthy

  # ── Worker de colas ───────────────────────────────────────────
  queue:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_APP_NAME: ${APP_NAME}
        VITE_REVERB_APP_KEY: ${REVERB_APP_KEY}
        VITE_REVERB_HOST: ${REVERB_HOST}
        VITE_REVERB_PORT: ${REVERB_PORT}
        VITE_REVERB_SCHEME: ${REVERB_SCHEME}
        VITE_PUSHER_APP_KEY: ${PUSHER_APP_KEY}
        VITE_PUSHER_APP_CLUSTER: ${PUSHER_APP_CLUSTER}
    container_name: oficios_queue
    restart: unless-stopped
    command: ["php", "artisan", "queue:work", "--sleep=3", "--tries=3", "--max-time=3600"]
    env_file:
      - .env
    networks:
      - oficios_net
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data_SGD:
  public_asset_SGD:
  app_storage_SGD:
  app_logs_SGD:

networks:
  oficios_net:
    driver: bridge
